<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08060F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AD-LEARNING</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== APP SHELL: START ===== -->
<div id="app">

  <!-- Main Screens -->
  <section class="screen active" id="screen-home"     data-screen="home"></section>
  <section class="screen"        id="screen-subjects" data-screen="subjects"></section>
  <section class="screen"        id="screen-timer"    data-screen="timer"></section>
  <section class="screen"        id="screen-stats"    data-screen="stats"></section>

  <!-- Overlay Screens -->
  <section class="overlay-screen" id="course-overlay"></section>
  <section class="overlay-screen" id="player-overlay"></section>
  
  <!-- New Feature Overlays -->
  <section class="overlay-screen" id="journal-overlay"></section>
  <section class="overlay-screen" id="achievements-overlay"></section>
  <section class="overlay-screen" id="notebook-overlay"></section>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" id="bottom-nav" aria-label="Main navigation">
    <button class="nav-btn active" data-tab="home" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-btn" data-tab="subjects" aria-label="Courses">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Courses</span>
    </button>
    <button class="nav-btn" data-tab="timer" aria-label="Timer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>Timer</span>
    </button>
    <button class="nav-btn" data-tab="stats" aria-label="Stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span>Stats</span>
    </button>
  </nav>

  <!-- Floating Action Button -->
  <button class="fab" id="fab" aria-label="Add">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <!-- Modals Root -->
  <div id="modal-root"></div>

  <!-- Toast Root -->
  <div id="toast-root"></div>

</div>
<!-- ===== APP SHELL: END ===== -->

<script src="script.js"></script>
</body>
</html>
